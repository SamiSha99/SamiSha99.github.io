name: Deploy to GitHub Pages

on:
    push:
        branches: [master]
    # Rebuild weekly so a new GitHub Pages repos show up in the sitemap.
    schedule:
        - cron: "0 4 * * 1"
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
            - name: Install dependencies
              run: npm ci
            - name: Build
              run: npm run build
              env:
                  # Avoids the shared rate limit when listing the GitHub Pages repos.
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Check internal links
              uses: lycheeverse/lychee-action@v2
              with:
                  args: --offline --no-progress --include-fragments --root-dir ${{ github.workspace }}/dist --index-files index.html 'dist/**/*.html'
            - name: Setup Pages
              uses: actions/configure-pages@v6
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ./dist
                  # Keeps `.well-known/`, dotfiles are skipped by default.
                  include-hidden-files: true

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5

